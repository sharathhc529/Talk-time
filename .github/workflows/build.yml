name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon :timespeech:test

      - name: Build and lint
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleRelease :app:lintDebug

      - name: Show lint findings
        if: failure()
        run: find app/build -name 'lint-results*.txt' -exec cat {} + || true

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: timesay-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk

      - name: Publish GitHub Release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          tag="v${version}-build.${GITHUB_RUN_NUMBER}"
          mkdir -p release
          cp app/build/outputs/apk/release/app-release.apk "release/timesay-${version}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "release/timesay-${version}-debug.apk"
          gh release create "$tag" release/*.apk \
            --target "$GITHUB_SHA" \
            --title "Timesay ${version} (build ${GITHUB_RUN_NUMBER})" \
            --notes "Built from ${GITHUB_REF_NAME} at ${GITHUB_SHA}. Install timesay-${version}.apk on your phone; the -debug APK is for troubleshooting."

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/
            timespeech/build/reports/
          if-no-files-found: ignore
